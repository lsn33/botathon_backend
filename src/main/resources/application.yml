server:
  port: 8080

spring:
  application:
    name: planificacion
  datasource:
    # IP de la VM donde corre SQL Server (instancia con Blue Prism)
    url: "jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:planificacion};encrypt=true;trustServerCertificate=true;loginTimeout=15"
    username: ${DB_USER:planificacion_app}
    password: "${DB_PASSWORD:CambiarEsto#2026}"
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    # minimo 32 caracteres para HS256
    secret: "${JWT_SECRET:cambia-este-secreto-por-uno-largo-de-al-menos-32-caracteres}"
    expiracion-minutos: 480
  bot:
    # Blue Prism envia esta clave en el header X-API-Key
    api-key: "${BOT_API_KEY:cambiar-esta-api-key}"
  cors:
    # Acepta patrones. Agrega aqui la IP/puerto donde corra el frontend.
    origenes: "${CORS_ORIGENES:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*:[*],http://10.*:[*]}"
  ingesta:
    # Si llega un cargo que no esta en catalogo.cargo y trae codEsp, se crea solo
    crear-cargos-faltantes: true
  usuarios-iniciales:
    password: "${ADMIN_PASSWORD:Admin#2026}"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    cl.teleton: INFO
